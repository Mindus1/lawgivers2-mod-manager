name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # The build compiles against the game's assemblies, so it runs on the PC with the game installed.
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: dotnet build -c Release

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/Release/net6.0/ModManager.dll
          generate_release_notes: true
